# Task 1 evaluation: lm-evaluation-harness, zero-shot, fixed tasks + complete splits. (p3)
# Seven evaluation conditions (p4): baseline(once), Full FT midpoint+final, L2-SP/LoRA-4/
# LoRA-16/OPLoRA at final.

task: task1_eval

backend: hf                     # hf | vllm. Try vllm on the Colab L4 to speed GSM8K generation;
                                # HF is the fallback (see task1_llm/evaluate.py).
precision: float16              # p3: evaluate all models in FP16, dropout disabled
num_fewshot: 0                  # zero-shot (p3)
batch_size: 32                  # global lm-eval batch size; per-benchmark override below ("auto"
                                # lets lm-eval pick the largest that fits)
# limit:                        # (optional) cap examples/benchmark; set in a smoke eval config

# The seven evaluation conditions (p4 table). The shared baseline is the pretrained Qwen3-0.6B
# (update 0). Every other condition is a training run evaluated at the checkpoints declared in
# ITS OWN train config's `eval_checkpoints` (Full FT: 625 + 1250; the rest: 1250) — so the
# schedule is defined once, next to the run. Paths are relative to the repo root.
baseline:
  enabled: true
  label: baseline
  config: configs/task1/full_ft.yaml   # any config loads the same base Qwen3-0.6B; no checkpoint

conditions:
  - config: configs/task1/full_ft.yaml          # -> full_ft_u625, full_ft_u1250
  - config: configs/task1/full_ft_l2sp.yaml     # -> full_ft_l2sp_u1250
  - config: configs/task1/lora_r4.yaml          # -> lora_r4_u1250
  - config: configs/task1/lora_r16.yaml         # -> lora_r16_u1250
  - config: configs/task1/oplora_r16_k128.yaml  # -> oplora_r16_k128_u1250

benchmarks:
  gsm8k:
    lm_eval_task: gsm8k_cot     # p3 table: gsm8k_cot, generation
    split: test                 # Test / 1,319
    method: generation
    max_new_tokens: 1024        # p3: 1,024-new-token cap
    greedy: true                # greedy decoding
    use_chat_template: true     # non-thinking chat template (enable_thinking=False)
    enable_thinking: false
    primary_metric: exact_match # flexible-extraction exact match; unextractable => incorrect
  hellaswag:
    lm_eval_task: hellaswag     # Validation / 10,042; candidate likelihood
    split: validation
    method: likelihood
    use_chat_template: false    # stock completion prompts, no chat template (p3)
    primary_metric: acc_norm    # normalized accuracy (report raw acc too)
  boolq:
    lm_eval_task: boolq         # Validation / 3,270; candidate likelihood
    split: validation
    method: likelihood
    use_chat_template: false
    primary_metric: acc
    batch_size: 16              # BoolQ OOMs at the global 32 on an L4; drop to 16
  arc_easy:
    lm_eval_task: arc_easy      # Test / 2,376; candidate likelihood
    split: test
    method: likelihood
    use_chat_template: false
    primary_metric: acc_norm

report:
  raw_and_normalized: true      # report raw accuracy alongside normalized where available (p3)
  save_per_example: true        # per-example outputs, extracted GSM8K answers, truncation flags
  changes_from_baseline_pp: true  # changes from shared baseline in percentage points

# Merge check (p4 Step 5): verify merged vs unmerged logits agree on a small batch before eval.
# Gate is top-1 (argmax) agreement, which must be exact; logit_atol only warns (FP16 noise floor).
merge_check:
  enabled: true
  batch_size: 4
  logit_atol: 0.5
