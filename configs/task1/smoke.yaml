# Task 1 SMOKE config: tiny end-to-end run to verify resume / checkpoint / merge round-trips on
# Colab in minutes BEFORE committing to a ~3 h real run. NOT a graded run.
inherit: lora_r16.yaml
run_id: smoke_task1

data:
  num_examples: 64
train:
  total_updates: 20            # ~20 updates
  lr_schedule:
    warmup_updates: 2          # canonical location (deep-merges over _base's lr_schedule)
checkpoint:
  save_at_updates: [10, 20]    # checkpoint every ~10 steps to exercise save/resume
eval:
  config: configs/task1/smoke.yaml
eval_checkpoints: [20]

# Tiny eval: a handful of examples per benchmark so the harness path is exercised cheaply.
smoke_eval:
  limit_examples: 8
  gsm8k_max_new_tokens: 64
