# Task 3 offline experiments on supplied rollouts. (handout p11-p13)
task: task3_offline

data:
  # ATML-PA3-Data: 32 rollouts/question. Expected on DRIVE_ROOT/data (path is a config field).
  root: ${DRIVE_ROOT}/data/ATML-PA3-Data
  readme: ${DRIVE_ROOT}/data/ATML-PA3-Data/README.MD   # field definitions + extraction rule
  models:
    # `folder` is the on-disk subdirectory under `root` (the real ATML-PA3-Data layout); the loader
    # builds paths from `folder`, not `name`. `dataset` is the join-key value ("math"/"mathvista").
    - {name: Qwen2.5-3B-Instruct, folder: qwen25-math, type: llm, dataset: math, questions: 1000, rollouts: 32}
    - {name: Qwen2.5-VL-3B-Instruct, folder: qwen25vl-mathvista, type: vlm, dataset: mathvista, questions: 1000, rollouts: 32}
  files: [generations.parquet, probability_metrics.parquet]   # VLM also: attention_metrics.parquet
  join_keys: [dataset, sample_id, rollout_id]
  # Token measurements: sampled-token logp and full-distribution kl_u_p are RAW model dists
  # (before sampling transforms). Images not needed for offline analysis.

# Parquet column names, ISOLATED here so matching the ATML-PA3-Data schema is a config edit, not a
# code change. These are the REAL column names. The logical keys on the right are what the code uses
# (and what task3_ttc/signals.py documents as the per-rollout dict schema). NOTE: attention_metrics
# also has a per-token list named `n_generated_text_tokens` that clashes with generations' scalar of
# the same name; the loader reads attention with an explicit column list that EXCLUDES it.
columns:
  join:
    dataset: dataset
    sample_id: sample_id
    rollout_id: rollout_id
  generations:
    text: generated_text                    # loaded lazily (load_text), NOT in per-rollout dicts
    token_ids: generated_token_ids          # list[int32]; used only for the length-alignment check
    length: n_generated_text_tokens         # int32 scalar: number of generated text tokens
    extracted: extracted_answer             # nullable string
    gold: gold_answer
  probability:
    logp: logp                      # per-token sampled-token log-probability (list[float])
    kl_u_p: kl_u_p                  # per-token KL(U || p_t) (list[float])
  attention:                        # VLM only (attention_metrics.parquet): per-token group totals
    image: img_attn_total
    prompt: prompt_text_attn_total
    generated: generated_text_attn_total

# MathVista question metadata is NOT in the supplied parquet; it is fetched from the Hugging Face
# dataset AI4Math/MathVista (split testmini) and cached as a small JSON (metadata only, no images).
# The loader downloads it WITHOUT the image column (huggingface_hub lists repo files, fetches the
# testmini parquet, reads only `columns` with pyarrow) and joins to rollouts on `join_key == sample_id`
# (both as strings). Logical keys consumed by the MathVista equivalence rules: question_type,
# answer_type, choices (-> option letters), precision (float rounding), unit (trailing-unit strip),
# answer (metadata gold, used only for the --check self-report, never for grading).
metadata_source:
  dataset: AI4Math/MathVista
  split: testmini
  join_key: pid
  columns: [pid, question_type, answer_type, choices, precision, unit, answer]
  cache: splits/task3/mathvista_metadata.json

splits:
  # Sort 1,000 question IDs lexicographically, permute with NumPy default_rng(6304):
  # first 200 dev, remaining 800 held-out eval. Keep all rollouts of a question together (p11).
  seed: 6304
  dev_size: 200
  eval_size: 800
  ids_dir: splits/task3

correctness:
  # math-verify for MATH equivalence; MathVista answer-type/choice/precision rules from released
  # question metadata; MC answers as option letters. Form answer groups WITHOUT gold; same
  # equivalence for grading. Missing extraction -> single NO_ANSWER group, always incorrect (p11-12).
  math_backend: math-verify
  mathvista_backend: metadata_rules
  no_answer_group: NO_ANSWER
  freeze_scorer_before_eval: true

offline:
  budgets: [1, 2, 4, 8, 16, 32]   # candidate budgets N (p12)
  n_orders: 10                    # ten seeded permutations PER QUESTION, nested prefixes
  order_seed: 6304                # base seed for the per-question orders (TA-question #4)
  # Per-question order derivation (frozen in splits/task3/<dataset>_orders.json, reused by adaptive):
  #   rng = numpy.random.default_rng(numpy.random.SeedSequence([order_seed, q_index, k]))  k=0..9
  #   q_index = the question's position in the lexicographically sorted ID list; the permutation
  #   acts on the POSITIONS of the rollout-id-sorted rollouts and is stored as actual rollout_ids.
  order_seed_rule: "SeedSequence([order_seed, q_index, k]); q_index = lexicographic rank of sample_id"
  average: [orders, questions]    # average over orders within question, then across questions
  tie_break: earliest_supporting_rollout   # for score/vote ties in current order
  rwc_tie: average_ranks          # average ranks for tied RWC scores

signals:
  # L_i = (1/T_i) sum log p(y_{i,t}) ;  K_i = (1/T_i) sum KL(U || p_{i,t})  (from logp, kl_u_p)
  # VisConf (MathVista): v_{i,t} image-attention share -> V_i; calibrate token KL with 5th/95th
  # percentiles over current candidate set G -> c_{i,t}, C_i; Z_i = V_i * C_i. Recompute
  # calibration for each candidate prefix; linear-interpolation percentiles (p12-13).
  percentile_low: 0.05
  percentile_high: 0.95
  percentile_method: linear
  eps: 1.0e-8

comparisons:
  # Both datasets: FirstAns, self-consistency (1 vote/rollout), shortest (length-only control),
  # highest mean log-prob, highest self-certainty, self-certainty + RWC.
  both: [first_ans, self_consistency, shortest, highest_logprob, highest_self_certainty, self_certainty_rwc]
  # MathVista additionally: vision-only and VisConf (Z), each highest-score and RWC, plus the
  # tokenwise fusion ablation VisConf-token (Z_token), highest-score and RWC.
  mathvista_extra: [vision_only_highest, vision_only_rwc, visconf_highest, visconf_rwc,
                    visconf_token_highest, visconf_token_rwc]

report:
  # Accuracy, oracle coverage, generated-token cost (sum of retained token counts); FirstAns
  # counts only its first candidate. 1,000 paired question-level bootstrap for 95% CIs on main
  # accuracy differences, after averaging over orders (p12).
  metrics: [accuracy, oracle_coverage, generated_token_cost, distinct_answer_groups]
  bootstrap_resamples: 1000
  bootstrap_unit: question
  decompose_failures: true        # no-correct-generated vs correct-available-but-missed
