# Task 2 evaluation: development + final grounding evaluation. (handout p8-p9)
task: task2_eval

development:
  # Evaluate before training, every 500 main-run updates, and at stage endpoints (p8).
  at_updates: [0, 500, 1000, 1500, 2000, 2250, 2500, 3000, 3500, 3750, 4000, 4500]
  # Track caption reference loss + reference-answer NLL on both VQA dev suites under:
  conditions: [correct, complementary, no_image]
  # Reference-answer NLL: exclude termination; average token NLL within example before averaging.
  exclude_termination_in_nll: true
  # Image-swap penalty: delta_NLL = NLL(y|q, I_partner) - NLL(y|q, I_correct); positive => correct
  # image makes the original reference more likely.
  report_delta_nll: true

final:
  # Both final-test suites: greedy, thinking disabled, 16-new-token cap, batch 8 (p8).
  greedy: true
  enable_thinking: false
  max_new_tokens: 16
  batch_size: 8
  # Question and original references fixed across four image conditions (p8):
  conditions:
    correct: original_image
    complementary_swap: partner_image          # partner image with a different answer
    mismatched: unrelated_image_same_suite     # excludes both images of the original pair
    no_image: omit_visual_tokens               # rebuild masks/positions without visual tokens
  # Fix the mismatched-image mapping before generation and reuse across comparisons (p8).
  mismatched_mapping_file: splits/task2/mismatched_mapping.json

scoring:
  # Grounding questions: normalized exact match, presence and counting separated (p9).
  # Natural VQAv2: soft consensus accuracy vs all 10 answers, yes/no vs number vs other separated.
  #   s(a_hat) = (1/10) sum_i min(1, (1/3) sum_{j!=i} 1[a_hat == a_j])
  grounding_metric: normalized_exact_match
  vqa_metric: soft_consensus_accuracy
  separate_question_types: true
  # Also: pair accuracy, identical-answer rate, empty-answer rate, mean reference-answer NLL,
  # generation time per answer. Empty outputs kept in accounting (p9).
  report_pair_accuracy: true
  report_identical_answer_rate: true
  report_empty_answer_rate: true
  # Correct-image advantages over complementary swaps in accuracy and NLL.
  report_correct_image_advantage: true
  # 95% CI via 4,000 bootstrap resamples of COMPLETE pairs, matching sampled pair IDs (p9).
  bootstrap_resamples: 4000
  bootstrap_unit: pair
