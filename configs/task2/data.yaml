# Task 2 data preparation + split sizes. (handout p7-p8)
task: task2_data
seed: 6304

sources:
  coco:
    # COCO 2014 captions + instance annotations. train2014 for training, val2014 for dev/test.
    year: 2014
    captions_per_train_image: 3   # p7: three captions per training image
    captions_per_dev_image: 1
  vqav2:
    # VQAv2 complementary pairs: same question on two images with different reference answers.
    use_complementary_pairs: true

splits:
  # Pairs formed within each split; dev/test image-disjoint from each other and from training;
  # eval images cannot enter training/replay; training images may recur across stages (p7).
  coco_captions:
    train_images: 6000            # 6,000 x 3 = 18,000 caption examples
    train_examples: 18000
    dev_images: 96                # 96 images, one caption each
    test: null
  annotation_grounding:
    # Template questions generated programmatically from COCO object annotations (p7):
    #   presence: "Does this image contain [object]?" (yes/no)
    #   counting: "How many [objects] can you see?" (counts 1..4, paired with different counts)
    train: generated_pools        # sampled during training; no fixed count
    dev_pairs: 24                 # 24 pairs / 48 questions
    test_pairs: 64                # 64 pairs / 128 questions
  natural_vqav2:
    # Keep pairs whose normalized consensus answers differ, each with >=8/10 annotator agreement.
    # Training target = original answer string from consensus group; retain all 10 for scoring.
    min_annotator_agreement: 8
    train_pairs: 1536             # 1,536 pairs / 3,072 questions
    dev_pairs: 32                 # 32 pairs / 64 questions
    test_pairs: 96                # 96 pairs / 192 questions
    # Per-type pair counts yes/no : number : other (p8)
    train_type_counts: {yes_no: 640, number: 256, other: 640}
    dev_type_counts: {yes_no: 12, number: 8, other: 12}
    test_type_counts: {yes_no: 36, number: 24, other: 36}

# All selected image/question/pair IDs saved once and reused (p8). See splits/task2/.
ids_dir: splits/task2
answer_normalization: vqa_official   # same normalization throughout (adapted; see scoring.py)

# Standard public COCO-2014 / VQAv2 files, expected under DRIVE_ROOT/data/ (filenames are config
# fields so a different layout is a config edit, not a code change). Fetch with
# scripts/download_task2_data.sh.
paths:
  images:                          # image subdirectories under DRIVE_ROOT/data/
    train: train2014
    dev: val2014
    test: val2014
  coco_filename_template: "COCO_{subset}_{image_id:012d}.jpg"   # COCO-2014 naming
annotations:
  captions_train: captions_train2014.json
  captions_val: captions_val2014.json
  instances_train: instances_train2014.json
  instances_val: instances_val2014.json
  vqa_questions_train: v2_OpenEnded_mscoco_train2014_questions.json
  vqa_questions_val: v2_OpenEnded_mscoco_val2014_questions.json
  vqa_annotations_train: v2_mscoco_train2014_annotations.json
  vqa_annotations_val: v2_mscoco_val2014_annotations.json
  vqa_complementary_train: v2_mscoco_train2014_complementary_pairs.json
  vqa_complementary_val: v2_mscoco_val2014_complementary_pairs.json

# Image manifest (image_id -> subset) written by the selection step; features.py caches from it.
manifest: splits/task2/image_manifest.json

# SigLIP feature extraction + cache (features.py reads this config). (p7)
vision_encoder:
  name: google/siglip-base-patch16-224
  num_patches: 196                 # 14x14 final patch features, spatial order
  feature_dim: 768
features:
  cache_subdir: features           # under DRIVE_ROOT/task2
  batch_size: 32
  cache_dtype: float16

grounding:
  # presence/counting generation + dev/test freeze. The presence:counting split of the combined
  # annotation-derived dev (24) / test (64) pairs is unspecified by the handout; split evenly and
  # record it. Counting uses annotated counts in [1, 4].
  counting_range: [1, 4]
  dev_presence_pairs: 12
  dev_counting_pairs: 12
  test_presence_pairs: 32
  test_counting_pairs: 32

prompts:
  # Text wording (visual tokens are spliced BEFORE the question in the user turn, p9 Step 1).
  caption_instruction: "Describe this image."
  presence_template: "Does this image contain {object}?"
  counting_template: "How many {object} can you see?"

# TA-question #3: which 3 of the 5 captions per image. Default rule (recorded in the split file):
# the first three captions in ascending COCO caption-id order.
caption_selection_rule: first3_by_caption_id
